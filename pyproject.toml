[tool.poetry]
name = "forensa"
version = "0.1.0"
description = "Cryptographic evidence layer for enterprise AI agents"
authors = ["v_sen <v_sen@forensa.dev>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "apps" },
    { include = "packages" },
]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.121.0,<0.122"
uvicorn = { extras = ["standard"], version = "0.32.0" }
pydantic = "2.9.2"
pydantic-settings = "2.6.1"
sqlalchemy = { extras = ["asyncio"], version = "2.0.36" }
asyncpg = "0.30.0"
alembic = "1.13.3"
cryptography = ">=46.0.6,<47"
httpx = "0.27.2"
python-multipart = "0.0.27"
orjson = "3.11.6"
structlog = "24.4.0"
opentelemetry-api = "1.28.1"
opentelemetry-sdk = "1.28.1"
opentelemetry-instrumentation-fastapi = "0.49b1"
google-generativeai = ">=0.8.3,<0.9"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pytest-asyncio = ">=1.2.0"
pytest-cov = "5.0.0"
hypothesis = "6.118.0"
ruff = "0.7.2"
mypy = "1.13.0"
asgi-lifespan = "2.1.0"
bandit = "1.7.10"
pip-audit = "2.7.3"

[tool.poetry.scripts]
forensa-api = "apps.api.main:run"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config", "--cov=apps", "--cov=packages", "--cov=scripts", "--cov-branch", "--cov-report=term-missing", "--cov-fail-under=100"]
norecursedirs = ["_backup", ".git", ".venv", "__pycache__", "node_modules", "alembic"]
python_files = ["test_*.py"]
filterwarnings = ["error", "ignore::DeprecationWarning:pytest_asyncio"]

[tool.coverage.run]
branch = true
source = ["apps", "packages"]
omit = ["*/__init__.py", "*/tests/*", "alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C408", "E501", "SIM117"]
"alembic/versions/**" = ["E501"]
"tools/**" = ["E501"]


[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "."
